name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all stable backends
        run: moon check --target all --deny-warn
      - name: Test all stable backends
        run: moon test --target all --deny-warn
      - name: Verify generated interfaces
        run: |
          moon info
          python3 - <<'PY'
          from pathlib import Path

          for path in Path(".").rglob("pkg.generated.mbti"):
              text = path.read_text(encoding="utf-8")
              path.write_text(text.rstrip("\r\n") + "\n", encoding="utf-8", newline="\n")
          PY
          git diff --exit-code
